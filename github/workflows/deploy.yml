name: CI/CD Pipeline

on:
  push:
    branches: [ main ] # هيشتغل تلقائياً أول ما تعملي بوش على برانش main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-values: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # لو عندك ملف requirements.txt فيه pandas و requests و psycopg2

    - name: Lint and Test Code Syntax
      run: |
        python -m py_compile main.py analysis.py app.py

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Verify Docker Compose Configuration
      run: |
        docker compose config