services:
  # 1. قاعدة البيانات (PostgreSQL)
  db:
    image: postgres:15
    container_name: weather_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: weather_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - weather_network
    restart: always

  # 2. واجهة العرض والـ Dashboard (Streamlit)
  web_app:
    build: .
    container_name: weather_streamlit_app
    ports:
      - "8501:8501"
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: weather_db
      DB_PORT: 5432
    volumes:
      - .:/app
    networks:
      - weather_network
    depends_on:
      - db
    restart: always

  # 3. الـ Orchestrator الرسمي المستقر (n8n)
  orchestrator_n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: weather_n8n_orchestrator
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - weather_network
    depends_on:
      - db
    restart: always

volumes:
  postgres_data:
  n8n_data:

networks:
  weather_network: